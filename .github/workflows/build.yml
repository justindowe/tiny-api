name: build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/519143502747/locations/global/workloadIdentityPools/github/providers/tiny-api

      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - run: docker build -t us-central1-docker.pkg.dev/tiny-api-lab-jd/tiny-api/tiny-api:${{ github.sha }} .

      - run: docker push us-central1-docker.pkg.dev/tiny-api-lab-jd/tiny-api/tiny-api:${{ github.sha }}
